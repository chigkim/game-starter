<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Our Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF7EC;
      --card: #FFFFFF;
      --ink: #4A3523;
      --muted: #8A7461;
      --edge: #FFE0C0;
      --accent: #FF8C42;
      --accent-dark: #D9702E;
      --radius: 24px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    .wrapper { max-width: 1100px; margin: 0 auto; }

    header { text-align: center; padding: 24px 0 32px; }
    h1 {
      font-family: 'Baloo 2', cursive;
      font-weight: 800;
      font-size: clamp(2.2rem, 8vw, 4rem);
      line-height: 1.1;
    }
    header p { color: var(--muted); font-size: 1.1rem; margin-top: 6px; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr));
      gap: 20px;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 22px;
      background: var(--card);
      border: 3px solid var(--edge);
      border-radius: var(--radius);
      box-shadow: 0 5px 0 var(--edge);
      color: inherit;
      text-decoration: none;
      touch-action: manipulation;
      transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
    }
    .game-card:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge); }
    @media (hover: hover) {
      .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--edge); }
    }
    .card-icon { font-size: 2.6rem; line-height: 1; }
    .game-card h3 { font-family: 'Baloo 2', cursive; font-size: 1.4rem; line-height: 1.2; }
    .game-card .badge {
      display: block;
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
    }
    .game-card p { color: var(--muted); line-height: 1.5; flex: 1; }
    .play {
      align-self: flex-start;
      padding: 8px 22px;
      border-radius: 50px;
      background: var(--accent);
      box-shadow: 0 3px 0 var(--accent-dark);
      color: #fff;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      font-size: 1.1rem;
      padding: 40px 16px;
      border: 3px dashed var(--edge);
      border-radius: var(--radius);
    }
    .game-grid:has(.game-card) + .empty { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .game-card { transition: none; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <header>
    <h1>Our Games 🎈</h1>
    <p>Pick a game and play!</p>
  </header>

  <main>
    <!-- Newest game first. Copy this card for each game:
    <a class="game-card" href="my-game.html">
      <div class="card-icon">🦕</div>
      <h3>My Game! <span class="badge">v1 - Updated 2026-10-09 14:05 EDT</span></h3>
      <p>One or two sentences a parent can read to the child.</p>
      <span class="play">Play</span>
    </a>
    -->
    <div class="game-grid">

    </div>
    <p class="empty">No games yet. Ask your AI helper to make one!</p>
  </main>

</div>

</body>
</html>
